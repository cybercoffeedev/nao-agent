[project]
name = "nao-agent"
version = "0.1.0"
description = "AI-powered voice assistant for the SoftBank NAO v6 robot"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
